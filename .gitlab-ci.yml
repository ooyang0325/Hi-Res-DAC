      - hardware/MANUAL_120x100_PRIMARY_JLC_FAB_AUDIT.json
      - hardware/MANUAL_120x100_ESD_ROUTE_AUDIT.json
      - hardware/MANUAL_120x100_PRIMARY_DRC.json
      - hardware/MACRO_STUDY_SUMMARY.json
      - hardware/MACRO_STUDY_AUDIT.json
