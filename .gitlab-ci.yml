stages:
  - validate
  - deliver

default:
  image: kicad/kicad:10.0.1
  before_script:
    - export KICAD10_3DMODEL_DIR="$CI_PROJECT_DIR/hardware/KICAD_STOCK_MODELS"
    - sudo apt-get update -qq
    - sudo apt-get install -y --no-install-recommends python3-openpyxl
    - python3 -c 'import openpyxl, pcbnew; print("openpyxl and pcbnew available")'
    - kicad-cli version
    - sudo chown -R "$(id -u):$(id -g)" "$CI_PROJECT_DIR/.git"
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

validate_schematic:
  stage: validate
  script:
    - python3 hardware/audit_jlc_library.py
    - python3 hardware/derive_connector_footprints.py
    - python3 hardware/generate_schematic.py
    - python3 hardware/verify_schematic.py
    - python3 hardware/verify_design_notes.py
    - python3 hardware/verify_critical_footprints.py
    - python3 hardware/export_assembly_review.py
    - python3 hardware/export_g3_connector_overlay.py
    - python3 hardware/export_g3_part_overlay.py
    - git diff --exit-code -- hardware/DAC_HPA.kicad_sch hardware/0*.kicad_sch hardware/DAC_HPA.kicad_sym hardware/sym-lib-table hardware/jlc_footprints.json hardware/DAC_HPA.pretty/J701_GT-3321667P-01_maker_slots.kicad_mod hardware/DAC_HPA.pretty/J702_PJ-332A-6A_peg_holes.kicad_mod hardware/*_REVIEW_ONLY.csv hardware/G3_*_REVIEW_ONLY.svg hardware/G3_OVERLAY_INDEX.md

validate_placement:
  stage: validate
  needs:
    - validate_schematic
  script:
    # KiCad assigns new UUIDs on regeneration; validate committed geometry and nets.
    - python3 hardware/audit_placement.py hardware/DAC_HPA_100x80_REVIEW_ONLY.kicad_pcb --height 80 --check-invariants > hardware/PLACEMENT_100x80_AUDIT.json
    - python3 hardware/audit_placement.py hardware/DAC_HPA_100x100_BASELINE_REVIEW_ONLY.kicad_pcb --height 100 --check-invariants > hardware/PLACEMENT_100x100_BASELINE_AUDIT.json
    - python3 hardware/audit_placement.py hardware/DAC_HPA.kicad_pcb --height 100 --check-invariants > hardware/PLACEMENT_AUDIT.json
    - python3 hardware/audit_3d_models.py --output hardware/MODEL_3D_AUDIT.json
    - echo "Baseline and 120 x 100 manual primary geometry checked. Routing remains HOLD."
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - hardware/PLACEMENT_AUDIT.json
      - hardware/PLACEMENT_100x80_AUDIT.json
      - hardware/PLACEMENT_100x100_BASELINE_AUDIT.json
      - hardware/MODEL_3D_AUDIT.json

validate_manual_review:
  stage: validate
  needs:
    - validate_schematic
  script:
    # These are explicit hand placements. The read-only audits never move parts.
    - python3 hardware/audit_placement.py hardware/DAC_HPA_100x100_TIMER_STUDY_ONLY.kicad_pcb --height 100 --check-invariants > hardware/MANUAL_100x100_TIMER_PLACEMENT_AUDIT.json
    - python3 hardware/audit_dfa_dfm.py hardware/DAC_HPA_100x100_TIMER_STUDY_ONLY.kicad_pcb > hardware/MANUAL_100x100_TIMER_DFA_DFM_AUDIT.json
    - python3 hardware/audit_jlc_fab.py hardware/DAC_HPA_100x100_TIMER_STUDY_ONLY.kicad_pcb > hardware/MANUAL_100x100_TIMER_JLC_FAB_AUDIT.json
    - kicad-cli pcb drc --format json --severity-error --severity-warning -o hardware/MANUAL_100x100_TIMER_DRC.json hardware/DAC_HPA_100x100_TIMER_STUDY_ONLY.kicad_pcb
    - python3 hardware/check_manual_review.py hardware/MANUAL_100x100_TIMER_PLACEMENT_AUDIT.json hardware/MANUAL_100x100_TIMER_DFA_DFM_AUDIT.json hardware/MANUAL_100x100_TIMER_DRC.json --require-timer-feasible -o hardware/MANUAL_100x100_TIMER_SUMMARY.json
    - python3 hardware/audit_placement.py hardware/DAC_HPA_120x100_CLOCK_ESCAPE_STUDY_ONLY.kicad_pcb --height 100 --check-invariants > hardware/MANUAL_120x100_CLOCK_PLACEMENT_AUDIT.json
    - python3 hardware/audit_dfa_dfm.py hardware/DAC_HPA_120x100_CLOCK_ESCAPE_STUDY_ONLY.kicad_pcb > hardware/MANUAL_120x100_CLOCK_DFA_DFM_AUDIT.json
    - python3 hardware/audit_jlc_fab.py hardware/DAC_HPA_120x100_CLOCK_ESCAPE_STUDY_ONLY.kicad_pcb > hardware/MANUAL_120x100_CLOCK_JLC_FAB_AUDIT.json
    - kicad-cli pcb drc --format json --severity-error --severity-warning -o hardware/MANUAL_120x100_CLOCK_DRC.json hardware/DAC_HPA_120x100_CLOCK_ESCAPE_STUDY_ONLY.kicad_pcb
    - python3 hardware/check_manual_review.py hardware/MANUAL_120x100_CLOCK_PLACEMENT_AUDIT.json hardware/MANUAL_120x100_CLOCK_DFA_DFM_AUDIT.json hardware/MANUAL_120x100_CLOCK_DRC.json --require-timer-feasible --require-clean-drc --esd-limit-mm 4.2 -o hardware/MANUAL_120x100_CLOCK_SUMMARY.json
    - python3 hardware/audit_dfa_dfm.py hardware/DAC_HPA.kicad_pcb > hardware/MANUAL_120x100_PRIMARY_DFA_DFM_AUDIT.json
    - python3 hardware/audit_jlc_fab.py hardware/DAC_HPA.kicad_pcb > hardware/MANUAL_120x100_PRIMARY_JLC_FAB_AUDIT.json
    - python3 hardware/audit_esd_routes.py hardware/DAC_HPA.kicad_pcb > hardware/MANUAL_120x100_ESD_ROUTE_AUDIT.json
    - kicad-cli pcb drc --format json --severity-error --severity-warning -o hardware/MANUAL_120x100_PRIMARY_DRC.json hardware/DAC_HPA.kicad_pcb
    - python3 hardware/check_manual_review.py hardware/PLACEMENT_AUDIT.json hardware/MANUAL_120x100_PRIMARY_DFA_DFM_AUDIT.json hardware/MANUAL_120x100_PRIMARY_DRC.json --require-timer-feasible --require-clean-drc --esd-limit-mm 4.2 -o hardware/MANUAL_120x100_PRIMARY_SUMMARY.json
    - echo "Manual 120 x 100 placement, JLC policy screens, and four J701 TVS routes checked. Full routing and ESD test remain HOLD."
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - hardware/MANUAL_*_AUDIT.json
      - hardware/MANUAL_*_DRC.json
      - hardware/MANUAL_*_SUMMARY.json
      - hardware/MANUAL_120x100_ESD_ROUTE_AUDIT.json

deliver_review_package:
  stage: deliver
  needs:
    - validate_schematic
    - validate_placement
    - validate_manual_review
  script:
    - python3 hardware/export_assembly_review.py
    - kicad-cli sch export pdf -o hardware/DAC_HPA_review_only.pdf hardware/DAC_HPA.kicad_sch
    - test -s hardware/DAC_HPA_review_only.pdf
    - kicad-cli pcb export glb --force -o hardware/DAC_HPA_3D_REVIEW_ONLY.glb hardware/DAC_HPA.kicad_pcb
    - test -s hardware/DAC_HPA_3D_REVIEW_ONLY.glb
  artifacts:
    name: "dac-hpa-review-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - hardware/DAC_HPA_review_only.pdf
      - hardware/DAC_HPA_3D_REVIEW_ONLY.glb
      - hardware/JLCPCB_BOM_REVIEW_ONLY.csv
      - hardware/OWNER_FITTED_REVIEW_ONLY.csv
      - hardware/DNF_REVIEW_ONLY.csv
      - hardware/G3_CONNECTOR_OVERLAY_REVIEW_ONLY.svg
      - hardware/G3_PART_OVERLAY_REVIEW_ONLY.svg
      - hardware/G3_OVERLAY_INDEX.md
      - hardware/G3_OVERLAY_CHECKLIST.md
      - hardware/G1_G2_CONTINUITY_RECORD.md
      - hardware/G4_POLARITY_CHECKLIST.md
      - hardware/DAC_HPA.kicad_pcb
      - hardware/DAC_HPA_100x100_BASELINE_REVIEW_ONLY.kicad_pcb
      - hardware/DAC_HPA_placement_preview.png
      - hardware/DAC_HPA_100x80_REVIEW_ONLY.kicad_pcb
      - hardware/DAC_HPA_100x80_placement_preview.png
      - hardware/DAC_HPA_100x100_TIMER_STUDY_ONLY.kicad_pcb
      - hardware/DAC_HPA_120x100_CLOCK_ESCAPE_STUDY_ONLY.kicad_pcb
      - hardware/DAC_HPA_100x100_timer_preview.png
      - hardware/DAC_HPA_120x100_manual_preview.png
      - hardware/DAC_HPA_120x100_output_zoom.png
      - hardware/DAC_HPA_120x100_timer_zoom.png
      - hardware/DAC_HPA_120x100_clock_zoom.png
      - hardware/JLCPCB_DFA_DFM_RULES.md
      - hardware/MANUAL_PLACEMENT_REVIEW.md
      - hardware/ROUTABILITY_REVIEW.md
      - hardware/AUDIO_EMI_PLACEMENT_REVIEW.md
      - hardware/IV_7MM_RECHECK.md
